<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Student</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/layout.css"
    >

    <link
        rel="stylesheet"
        href="../css/dashboard.css"
    >

</head>


<body>


    <header class="navbar">

        <h1>
            🎓 Student Management System
        </h1>

        <button id="backBtn">
            ← Back
        </button>

    </header>


    <main class="container">


        <section class="page-heading">

            <h2>
                Add New Student
            </h2>

            <p>
                Enter the student's information below.
            </p>

        </section>


        <section class="form-section">


            <form id="studentForm">


                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter student name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="Enter phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        placeholder="Enter age"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="course">
                        Course
                    </label>

                    <select
                        id="course"
                        required
                    >

                        <option value="">
                            Select Course
                        </option>

                        <option value="CSE">
                            CSE
                        </option>

                        <option value="ECE">
                            ECE
                        </option>

                        <option value="IT">
                            IT
                        </option>

                        <option value="EEE">
                            EEE
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter city"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="submit-btn"
                >
                    Add Student
                </button>


            </form>


        </section>


    </main>


    <script
        type="module"
        src="../js/addStudent.js"
    ></script>


    <script>

        document
            .getElementById("backBtn")
            .addEventListener(
                "click",
                function () {

                    window.location.href =
                        "index.html";

                }
            );

    </script>


</body>

</html>
