<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Details | Student Management System</title>


    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <!-- Layout CSS -->
    <link
        rel="stylesheet"
        href="../css/layout.css"
    >

    <!-- Dashboard CSS -->
    <link
        rel="stylesheet"
        href="../css/dashboard.css"
    >


    <style>

        /* =========================================
           STUDENT DETAILS CARD
        ========================================= */

        .student-details-card {

            max-width: 850px;

            margin: 0 auto;

            background: white;

            padding: 35px;

            border-radius: 14px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.08);
        }


        /* =========================================
           DETAIL ROW
        ========================================= */

        .detail-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 18px 20px;

            border-bottom: 1px solid #e2e8f0;

            transition: 0.2s;
        }


        .detail-row:last-child {

            border-bottom: none;
        }


        .detail-row:hover {

            background: #f8fafc;

            border-radius: 8px;
        }


        /* =========================================
           DETAIL LABEL
        ========================================= */

        .detail-label {

            color: #64748b;

            font-size: 14px;

            font-weight: 600;

            min-width: 160px;
        }


        /* =========================================
           DETAIL VALUE
        ========================================= */

        .detail-row span:last-child {

            color: #1e293b;

            font-size: 16px;

            font-weight: 600;

            text-align: right;

            word-break: break-word;
        }


        /* =========================================
           STUDENT NAME
        ========================================= */

        #studentName {

            color: #1e3a8a;

            font-size: 18px;
        }


        /* =========================================
           STUDENT ID
        ========================================= */

        #studentId {

            background: #dbeafe;

            color: #1d4ed8;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 13px;
        }


        /* =========================================
           COURSE
        ========================================= */

        #studentCourse {

            background: #eff6ff;

            color: #2563eb;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 13px;
        }


        /* =========================================
           BACK BUTTON
        ========================================= */

        #backBtn {

            background: white;

            color: #1e3a8a;

            border: none;

            padding: 10px 16px;

            border-radius: 7px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        #backBtn:hover {

            background: #dbeafe;

            transform: translateY(-1px);
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .student-details-card {

                width: 95%;

                padding: 20px;
            }


            .detail-row {

                flex-direction: column;

                align-items: flex-start;

                gap: 7px;
            }


            .detail-label {

                min-width: auto;
            }


            .detail-row span:last-child {

                text-align: left;

                font-size: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVIGATION BAR
    ========================================== -->

    <header class="navbar">

        <h1>
            🎓 Student Management System
        </h1>


        <button id="backBtn">
            ← Back
        </button>

    </header>



    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main class="container">


        <!-- PAGE HEADING -->

        <section class="page-heading">

            <h2>
                Student Details
            </h2>

            <p>
                Complete information about the student.
            </p>

        </section>



        <!-- =====================================
             STUDENT DETAILS
        ====================================== -->

        <section class="student-details-card">


            <div class="detail-row">

                <span class="detail-label">
                    Student ID
                </span>

                <span id="studentId">
                    -
                </span>

            </div>



            <div class="detail-row">

                <span class="detail-label">
                    Name
                </span>

                <span id="studentName">
                    -
                </span>

            </div>



            <div class="detail-row">

                <span class="detail-label">
                    Email
                </span>

                <span id="studentEmail">
                    -
                </span>

            </div>



            <div class="detail-row">

                <span class="detail-label">
                    Phone
                </span>

                <span id="studentPhone">
                    -
                </span>

            </div>



            <div class="detail-row">

                <span class="detail-label">
                    Age
                </span>

                <span id="studentAge">
                    -
                </span>

            </div>



            <div class="detail-row">

                <span class="detail-label">
                    Course
                </span>

                <span id="studentCourse">
                    -
                </span>

            </div>



            <div class="detail-row">

                <span class="detail-label">
                    City
                </span>

                <span id="studentCity">
                    -
                </span>

            </div>


        </section>


    </main>



    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="../js/studentDetails.js"
    ></script>


    <!-- BACK BUTTON -->

    <script>

        document
            .getElementById("backBtn")
            .addEventListener(
                "click",
                function () {

                    window.location.href =
                        "index.html";

                }
            );

    </script>


</body>

</html>
